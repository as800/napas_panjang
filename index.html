<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Napas Panjang – Game Ketahanan Finansial</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efee;--ink:#14233a;--muted:#5a6a7c;--card:#fbfdfc;--line:#c9d6d3;--acc:#f2b705;--acc-ink:#14233a;--good:#1b7f54;--bad:#c2402d;--soft:#dde7e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1823;--ink:#e7eef4;--muted:#93a4b5;--card:#16242f;--line:#2a3b49;--acc:#f2b705;--acc-ink:#14233a;--good:#46c58b;--bad:#ff7a66;--soft:#1f313e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1823;--ink:#e7eef4;--muted:#93a4b5;--card:#16242f;--line:#2a3b49;--acc:#f2b705;--acc-ink:#14233a;--good:#46c58b;--bad:#ff7a66;--soft:#1f313e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 48px}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.1;letter-spacing:-.02em}
h1{font-size:clamp(32px,7vw,52px);font-weight:800}
h2{font-size:24px;font-weight:700}h3{font-size:18px;font-weight:700}
p{margin:0}.muted{color:var(--muted)}.sm{font-size:14px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font:800 20px "Bricolage Grotesque",sans-serif}
.brand span{background:var(--acc);color:var(--acc-ink);padding:0 8px;border-radius:6px;margin-right:6px}
.btn{font:700 15px "DM Sans",sans-serif;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(.95);background:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.hero{margin:10px 0 22px}.hero p{max-width:60ch;margin-top:12px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
label.f{display:block;font-weight:700;font-size:14px}
label.f small{display:block;font-weight:400;color:var(--muted)}
input[type=number],input.num{width:100%;margin-top:6px;padding:10px 12px;font:500 16px "DM Sans",sans-serif;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}
.nw{padding:20px;border-radius:14px;background:var(--ink);color:var(--bg)}
.nw .lbl{font-size:14px;opacity:.75}
.nw .big{font:800 clamp(34px,8vw,56px)/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:4px 0 12px}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px}
.chip b{display:block;font:700 18px "Bricolage Grotesque",sans-serif}
.chip.debt b{color:var(--bad)}
.gauge{height:6px;background:var(--soft);border-radius:9px;margin-top:8px;overflow:hidden}.gauge i{display:block;height:100%;background:var(--good)}
.stage{margin-top:14px}
.ledger{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.ledger li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;display:flex;justify-content:space-between;gap:14px;align-items:center;width:100%;font:inherit;color:inherit;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt b{display:block}
.tag{font-size:13px;font-weight:700;white-space:nowrap;padding:3px 8px;border-radius:99px;background:var(--soft)}
.tag.r{color:var(--bad)}.tag.g{color:var(--good)}
.alert{border-left:6px solid var(--bad);background:var(--card);border-radius:12px;padding:16px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.alert .amt{font:800 30px "Bricolage Grotesque",sans-serif;color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:12px}
.row>*{flex:1 1 170px}
.mini{display:flex;gap:6px;margin-top:6px}.mini button{font:600 12px "DM Sans";padding:4px 8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.grade{font:800 72px "Bricolage Grotesque",sans-serif;line-height:1}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.chart{width:100%;height:auto;display:block;margin:10px 0}
.ins{padding-left:18px;margin:8px 0 0}.ins li{margin-bottom:6px}
.toggle{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-top:14px;scrollbar-width:thin}
.tab{flex:0 0 auto;min-width:112px;text-align:left;font:inherit;color:var(--ink);border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:52px}
.tab b{display:block;font-size:14px}.tab span{font-size:13px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected=true] span{color:var(--bg);opacity:.8}
.tab.urg{border-color:var(--bad)}.tab.urg b{color:var(--bad)}.tab.urg[aria-selected=true] b{color:var(--bg)}
.tab:disabled{opacity:.4;cursor:not-allowed}.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.panel{margin-top:6px}
.xr{border-top:1px dashed var(--line);padding:14px 0}.xr:first-of-type{border-top:0}
.xh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.xh span{display:block}.xb{font:700 18px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.xi{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.xi input{flex:1 1 150px;margin:0;width:auto}
.fill{font:600 12px "DM Sans";padding:6px 10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;min-height:36px}
.msg{background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:500}
.foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 8px;margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.foot .btn{flex:1 1 220px}.foot p{flex:2 1 200px}
.big2{font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.hide{display:none}
.tab.new{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.tab.new{animation:none}}
.lvo .ledger{margin-top:8px}
fieldset.lv{border:0;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lv legend{font-weight:700;font-size:14px;margin-bottom:6px;padding:0}
.lvo{display:block;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card)}
.lvo:has(input:checked){border-color:var(--ink);background:var(--soft)}
.lvo input{margin-right:6px;accent-color:var(--acc)}.lvo span{display:block}
.steps{padding-left:20px;margin:8px 0 0}.steps li{margin-bottom:8px}.steps li span{display:block}
.steps li.done b{color:var(--good)}.steps li.now{background:var(--soft);border-radius:8px;padding:6px 8px;margin-left:-8px}
dialog{max-width:760px;width:calc(100% - 24px);max-height:86vh;overflow:auto;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
details{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.warn{background:var(--soft);border-left:6px solid var(--bad);border-radius:10px;padding:12px;margin-top:12px}
.stress{margin-top:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px}
.stress .sh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sbar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}.sbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.spark{width:96px;height:28px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.sbar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><span>NP</span>Napas Panjang</div><div style="display:flex;gap:8px"><button class="btn hide" id="hb">Riwayat</button><button class="btn" id="th" aria-label="Ganti tema">Tema</button></div></header>
<main id="app"></main>
<dialog id="dlg" aria-label="Riwayat keuangan"></dialog>
</div>
<script>
const RATE={keluarga:0.01,kartu:0.025,pinjol:0.09};
const rateOf=(k,m,since)=>k=='keluarga'?(since!=null&&m-since>=6?0.02:0.01):RATE[k];
const capFor=(o,k)=>k=='keluarga'?Math.max(0,C.gaji-o.debt.keluarga):k=='kartu'?Math.max(0,Math.max(C.gaji,o.ef)-o.debt.kartu):Math.max(0,(C.gaji*10-o.debt.pinjol)/1.1);
const DDESC={keluarga:'Tanda terima kasih 1% per bulan, naik jadi 2% jika belum lunas setelah 6 bulan',kartu:'Bunga 2,5% per bulan, plafon mengikuti dana darurat (minimal 1× gaji)',pinjol:'Bunga 9% per bulan + admin 10%, plafon besar (10× gaji)'};
const INV={su:{n:'Surat Utang',mu:0.005,sd:0.004,lo:-0.01,hi:0.02,fee:0.01,d:'Risiko rendah · sekitar 6% per tahun, stabil'},rd:{n:'Reksa Dana',mu:0.008,sd:0.04,lo:-0.12,hi:0.12,fee:0.02,d:'Risiko menengah · sekitar 10% per tahun, cukup naik turun'},sh:{n:'Saham',mu:0.012,sd:0.08,lo:-0.25,hi:0.30,fee:0.03,d:'Risiko tinggi · potensi 14% per tahun, bisa jatuh tajam'}};
const NAMA={keluarga:'Pinjam keluarga/teman',kartu:'Kartu kredit / paylater',pinjol:'Pinjol'};
const LEVELS={
 mudah:{n:'Mudah',d:'Ada panduan langkah demi langkah. Pengeluaran dan biaya tak terduga paling ringan.',gaji:9000000,side:1500000,exp:5500000,kas:6000000,ef:6000000,sudden:1500000,prob:25,edu:0.4,eduM:0.30,off:0.18,vm:0.8},
 normal:{n:'Normal',d:'Saran singkat tiap bulan. Pengeluaran dan biaya tak terduga menengah.',gaji:9000000,side:1500000,exp:7000000,kas:4000000,ef:3000000,sudden:2000000,prob:33,edu:0.6,eduM:0.45,off:0.22,vm:1},
 sulit:{n:'Sulit',d:'Tanpa panduan. Pengeluaran besar, biaya tak terduga sering, pasar bergejolak.',gaji:9000000,side:1500000,exp:8500000,kas:2000000,ef:1000000,sudden:2500000,prob:40,edu:0.8,eduM:0.55,off:0.25,vm:1.25}};
let LVSEL='normal',DURSEL=3;
const LVST={mudah:0,normal:4,sulit:10},HI=[1,4],NI=[0,2,3,5,6,7,8];
let PER;
/* hr = peluang kejadian mendadak berupa masalah kesehatan, med = pengali biayanya, base = tekanan dasar (stres) */
const PERSONAS=[
 {nama:'Bayu',umur:38,fam:'Menikah, 2 anak usia sekolah',sehat:'Diabetes tipe 2, perlu kontrol dan obat rutin',hr:0.7,med:1.3,base:8,
  cerita:'Kamu Bayu, 38 tahun, pria menikah dengan 2 anak yang masih sekolah. Setahun terakhir dokter mendiagnosis diabetes tipe 2. Kontrol rutin dan obat sudah jadi bagian hidupmu, dan dokter mengingatkan kondisinya bisa memburuk sewaktu-waktu. Keluargamu bergantung pada penghasilanmu.',
  saran:'Kondisi kesehatanmu rentan, jadi biaya medis besar bisa datang kapan saja. Asuransi patut dipertimbangkan serius.'},
 {nama:'Rina',umur:34,fam:'Menikah, 1 anak balita',sehat:'Asma ringan, kadang kambuh saat cuaca berubah',hr:0.4,med:1.1,base:5,
  cerita:'Kamu Rina, 34 tahun, menikah dan punya satu anak balita. Asma ringanmu sesekali kambuh saat cuaca berubah, dan anakmu sedang masa rawan sakit. Sejauh ini semuanya masih terkendali, tapi kamu tahu satu kali rawat bisa cukup mahal.',
  saran:'Risiko kesehatanmu sedang. Kejadian medis mungkin muncul beberapa kali, dan kamu perlu menimbang apakah premi bulanan sepadan.'},
 {nama:'Andi',umur:42,fam:'Menikah, 2 anak',sehat:'Tampak sehat, tapi sering lembur dan jarang cek kesehatan',hr:0.35,med:1.15,base:6,
  cerita:'Kamu Andi, 42 tahun, pria menikah dengan 2 anak. Kamu merasa sehat, tapi sering lembur, kurang tidur, dan sudah bertahun-tahun tidak cek kesehatan. Istrimu tidak bekerja, jadi kalau kamu tumbang, pemasukan keluarga ikut terganggu.',
  saran:'Risikonya tidak terlihat, tapi nyata. Usia dan gaya hidupmu bisa memunculkan masalah kesehatan mendadak.'},
 {nama:'Sari',umur:27,fam:'Lajang, belum ada tanggungan',sehat:'Sehat, rutin berolahraga',hr:0.1,med:1,base:0,
  cerita:'Kamu Sari, 27 tahun, lajang dan sehat. Kamu rutin berolahraga, jarang sakit, dan belum punya tanggungan selain sesekali membantu orang tua di kampung.',
  saran:'Kondisimu sehat dan risiko medisnya rendah. Asuransi tetap melindungi dari kejadian langka, tapi premi bulanan bisa terasa sia-sia kalau tidak pernah terpakai.'},
 {nama:'Tio',umur:32,fam:'Lajang, membantu orang tua',sehat:'Sehat, jarang sakit',hr:0.15,med:1,base:3,income:[0.55,1.45],
  cerita:'Kamu Tio, 32 tahun, pekerja lepas di bidang kreatif. Pemasukanmu berubah-ubah mengikuti proyek, tetapi kamu tetap membantu orang tua setiap bulan.',
  saran:'Penghasilanmu bisa berubah dari sekitar 55% sampai 145% dari jumlah normal setiap bulan. Risiko medis rendah, jadi fokuslah menjaga kas untuk bulan sepi.'},
 {nama:'Maya',umur:39,fam:'Menikah, 1 anak, membantu ibu',sehat:'Sehat, tetapi mudah kelelahan',hr:0.2,med:1.05,base:7,income:[0.4,1.6],
  cerita:'Kamu Maya, 39 tahun, mengelola katering rumahan sambil mengurus anak dan membantu ibumu. Pesanan tidak selalu ramai, sehingga pemasukan keluarga cukup bergejolak.',
  saran:'Penghasilanmu bisa berubah dari sekitar 40% sampai 160% dari jumlah normal setiap bulan. Tanggungan keluarga membuat bulan sepi terasa lebih menekan.'},
 {nama:'Sinta',umur:42,fam:'Menikah, 2 anak usia sekolah',sehat:'Sehat, mengelola warung kecil',hr:0.2,med:1.05,base:7,income:[0.65,1.35],bizRisk:0.1,
  cerita:'Kamu Sinta, 42 tahun, menjalankan warung kecil bersama keluarga. Pendapatan usaha naik turun, dan kerusakan stok atau pembayaran pelanggan yang macet kadang membuat usaha merugi.',
  saran:'Penghasilan usaha berubah dari bulan ke bulan. Setiap bulan ada peluang 10% mengalami kerugian usaha sebesar setengah sampai satu kali pengeluaran bulanan.'}
];
const fpc=v=>(v>=0?'+':'−')+(Math.abs(v)*100).toFixed(1).replace('.',',')+'%';
const stLv=v=>v<30?['Tenang','var(--good)']:v<55?['Waspada','var(--acc)']:v<75?['Tertekan','#e07b1f']:['Sangat tertekan','var(--bad)'];
const parseN=v=>+String(v==null?'':v).replace(/\D/g,'')||0;
const fmtN=n=>String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
let C,S,need,app=document.getElementById('app');
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('num'))return;
 const pos=t.selectionStart,d=t.value.slice(0,pos).replace(/\D/g,'').length,n=t.value.replace(/\D/g,'');
 t.value=n?fmtN(+n):'';let p=0,c=0;while(p<t.value.length&&c<d){if(/\d/.test(t.value[p]))c++;p++}try{t.setSelectionRange(p,p)}catch(_){}});
const fmt=n=>(n<-0.5?'−':'')+'Rp\u00a0'+fmtN(n);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const norm=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const debtTotal=()=>S.debt.keluarga+S.debt.kartu+S.debt.pinjol;
const invT=()=>S.iv.su+S.iv.rd+S.iv.sh;

const expNow=()=>Math.max(C.exp*0.5,expBase()+S.exAdj);

document.getElementById('th').onclick=()=>{
 const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 r.dataset.theme=dark?'light':'dark'};

/* ---------- SETUP ---------- */

 PER=PERSONAS[Math.floor(Math.random()*PERSONAS.length)];
 S={rec:[],px:{su:[100],rd:[100],sh:[100]},ret:{su:0,rd:0,sh:0},stress:18+PER.base+LVST[C.lv],insStart:false,cur:null,tab:'sum',msg:'',m:0,cash:C.kas,ef:C.ef,iv:{su:0,rd:0,sh:0},debt:{keluarga:0,kartu:0,pinjol:0},ins:false,hist:[],scores:[],ledger:[],pinjolN:0,kejadian:0,rugi:0,exAdj:0,gajiMul:1,sideMul:1,prop:0,eqM:0,com:[],offer:null,offLast:{},offLog:[],scn:genScn(),kSince:null,adm:0,buys:[],eduN:0,eduTot:0};
 S.yNW=nw();S.hist.push(nw());
 intro();

function setup(){
 $('hb').classList.add('hide');
 app.innerHTML=`<section class="hero"><h1>Bertahan sampai gajian, lalu sampai bertahun-tahun.</h1>
 <p>Hadapi 1 sampai 3 tahun keuangan: gaji masuk, tagihan jalan, biaya mendadak dan biaya pendidikan datang, dan sesekali ada tawaran yang mengubah pengeluaran rutinmu. Di akhir tiap tahun, aset bersihmu dinilai. Jaga juga tingkat stresmu, karena keuangan yang rapuh membuat hidup terasa berat.</p></section>
 <div class="card"><h2>Pilih tingkatan</h2><p class="muted sm">Kondisi awalmu sudah ditentukan. Makin tinggi tingkatannya, makin besar pengeluaran rutin dan makin sering biaya mendadak serta biaya pendidikan.</p>

function offerInsight(L){
 const bor=S.rec.filter(r=>r.m>L.m&&r.m<=L.m+6&&r.bor).length,pv=L.val,fl=[];
 if(L.cov<3)fl.push('dana darurat baru '+L.cov.toFixed(1)+' bulan');
 if(L.res=='terima'&&L.cash<L.e)fl.push('kas tersisa '+fmt(L.cash)+', kurang dari 1 bulan pengeluaran');
 let t,good;
 if(L.res=='terima'){
  if(L.id=='kursus'&&L.lulus===false){t='Kamu mengambil risiko dan belum lulus, jadi biaya hangus. Peluang 75% memang tidak pasti, nilai harapannya tetap '+(pv>0?'positif':'negatif')+'.';good=pv>0&&!fl.length}
  else if(L.id=='gaya'&&L.st>=60&&!fl.length){t='Wajar: stresmu sedang tinggi ('+Math.round(L.st)+' dari 100) dan kasmu aman. Pengeluaran ini tidak untung secara angka (sekitar '+fmt(pv)+'), tapi menjaga kesehatan mental juga penting.';good=true}
  else if(pv>0&&!fl.length){t='Keputusan tepat. Perkiraan keuntungan sampai akhir permainan sekitar '+fmt(pv)+', dan kasmu siap saat itu.';good=true}
  else if(pv>0){t='Menguntungkan secara angka (sekitar '+fmt(pv)+'), tapi waktunya berisiko: '+fl.join(' dan ')+'.';good=false}
  else{t='Kurang tepat secara angka: perkiraan dampaknya '+fmt(pv)+' sampai akhir permainan.'+(L.id=='gaya'?' Ini pengeluaran gaya hidup tanpa imbal balik finansial, hanya menurunkan stres (stresmu saat itu '+Math.round(L.st)+').':'')+(L.id=='kpr'?' Dalam 3 tahun KPR belum terasa untung. Manfaat terbesarnya baru muncul pada jangka lebih panjang.':'');good=false}
  if(bor)t+=' Dalam 6 bulan setelahnya kamu berutang '+bor+' kali, kemungkinan akibat beban baru ini.';
 }else{
  if(pv<0){t='Tepat: kamu menghindari perkiraan kerugian '+fmt(-pv)+'.';good=true}
  else if(L.cash<L.up||fl.length){t='Wajar: tawaran ini sebenarnya menguntungkan (sekitar '+fmt(pv)+'), tapi kondisimu belum siap ('+(fl.join(', ')||'kas kurang untuk biaya awal')+'). Siapkan dana lebih dulu supaya bisa mengambil peluang seperti ini.';good=true}
  else{t='Peluang terlewat: perkiraan keuntungan yang hilang sekitar '+fmt(pv)+'. Kasmu sebenarnya cukup saat itu.';good=false}
 }
 return {txt:t,good};
}

 const gain=tot(r=>r.gain),intr=tot(r=>r.intr),borM=R.filter(r=>r.bor).length,defM=R.filter(r=>r.deficit).length;

 <p class="muted sm">Dari bulan 1 sampai bulan ke-${all.length}.</p>
 <ul class="ledger">${li('Aset bersih awal → sekarang',fmt(S.hist[0])+' → '+fmt(nw()),nw()>=S.hist[0]?'pos':'neg')}
 ${li('Total pemasukan',fmt(sum(r=>r.inc+r.side)))}${li('Total pengeluaran rutin',fmt(sum(r=>r.exp+r.prem)))}
 ${li('Total bunga utang dibayar',fmt(sum(r=>r.intr)),'neg')}${li('Total hasil investasi',fmt(sum(r=>r.gain)),sum(r=>r.gain)>=0?'pos':'neg')}
 ${li('Kejadian mendadak dan kerugian usaha',eventN+' kali, '+fmt(sum(r=>(r.ev?r.ev[1]:0)+(r.biz?r.biz[1]:0))))}${li('Pinjol dipakai',S.pinjolN+' kali')}${li('Biaya pendidikan',S.eduN+' kali, '+fmt(S.eduTot))}${li('Biaya jual investasi',fmt(S.rugi),'neg')}</ul>
 ${chart()}<h3 style="margin-top:14px">Bulan demi bulan</h3>
 ${all.slice().reverse().map((r,i)=>{const net=r.inc+r.side-r.exp-r.prem,y=Math.floor(r.m/12)+1,b=r.m%12+1;
 return `<details ${i==0?'open':''}><summary><b>Tahun ${y}, bulan ${b}${r.now?' (berjalan)':''}</b><span>${fmt(r.nw)}</span></summary><ul class="ledger">
 ${li('Gaji pokok',fmt(r.inc))}${li('Side job',fmt(r.side))}${li('Pengeluaran rutin',fmt(-r.exp),'neg')}${r.prem?li('Premi asuransi',fmt(-r.prem),'neg'):''}
 ${li('Arus kas rutin',(net>=0?'+':'')+fmt(net),net>=0?'pos':'neg')}${r.intr>0.5?li('Bunga utang',fmt(-r.intr),'neg'):''}${Math.abs(r.gain)>0.5?li('Hasil investasi',(r.gain>=0?'+':'')+fmt(r.gain),r.gain>=0?'pos':'neg'):''}
 ${r.ret?li('Pergerakan pasar',Object.keys(INV).map(k=>INV[k].n+' '+fpc(r.ret[k])).join(', ')):''}${li('Tingkat stres',Math.round(r.st)+' dari 100',r.st>=75?'neg':'')}${r.deficit?li('Defisit yang harus ditutup',fmt(r.deficit),'neg'):''}${r.ev?li('Kejadian: '+r.ev[0],fmt(-r.ev[1]),'neg'):''}${r.biz?li('Kerugian usaha: '+r.biz[0],fmt(-r.biz[1]),'neg'):''}${r.edu?li('Pendidikan: '+r.edu[0],fmt(-r.edu[1]),'neg'):''}</ul>
 <p class="sm"><b>Keputusanmu</b></p>${r.dec.length?`<ul class="ins sm">${r.dec.map(d=>`<li>${d}</li>`).join('')}</ul>`:'<p class="sm muted">Belum ada keputusan di bulan ini.</p>'}</details>`}).join('')}`;
 $('dlg').showModal();
}
$('hb').onclick=showHist;
$('dlg').addEventListener('click',e=>{if(e.target.id=='cl'||e.target===$('dlg'))$('dlg').close()});

/* ---------- RAPOR TAHUNAN ---------- */
function chart(){
 const h=S.hist,W=600,H=150,mn=Math.min(...h),mx=Math.max(...h),sp=(mx-mn)||1;
 const pts=h.map((v,i)=>`${(i/(h.length-1||1)*W).toFixed(1)},${(H-8-(v-mn)/sp*(H-16)).toFixed(1)}`).join(' ');
 let lines='';for(let y=12;y<h.length-1;y+=12){const x=y/(h.length-1)*W;lines+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--line)" stroke-dasharray="4 4"/>`}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik aset bersih per bulan"><rect width="${W}" height="${H}" fill="var(--soft)" rx="10"/>${lines}<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/></svg>
 <div class="sm muted">Terendah ${fmt(mn)} · Tertinggi ${fmt(mx)}</div>`;
}
const gradeRel=s=>s>=85?'A':s>=70?'B':s>=55?'C':s>=40?'D':'E';
function computeScore(){
 const {best,pas}=analyze(),R=S.rec,n=R.length,mine=nw(),sum=f=>R.reduce((a,r)=>a+f(r),0),inc=sum(r=>r.inc+r.side),I=[];
 const needOf=r=>(r.ev?r.ev[1]:0)+(r.biz?r.biz[1]:0)+(r.edu?r.edu[1]:0)+(r.deficit||0),pc=v=>Math.round(v*100);
 // 1. aset
 const room=best.nw-pas.nw,dn=0.5*Math.max(room,C.exp),off=room<C.exp?0.5*(1-room/C.exp):0,target=pas.nw+dn*(1-off);
 I.push({n:'Nilai aset',w:30,s:mine>=best.nw?100:clamp(off+(mine-pas.nw)/dn,0,1)*100,t:`Aset bersihmu ${fmt(mine)}. Hanya menyimpan kas: ${fmt(pas.nw)}. Strategi terbaik: ${fmt(best.nw)}. Skor penuh dicapai jika asetmu mencapai ${fmt(target)}, yaitu separuh jalan menuju strategi terbaik, karena strategi terbaik memanfaatkan hasil pasar yang tidak bisa ditebak.`});
 // 2. investasi
 const tb=S.buys.reduce((a,b)=>a+b.v,0),ready=tb?S.buys.filter(b=>b.ok).reduce((a,b)=>a+b.v,0)/tb:0;
 const ratio=sum(r=>r.nw>0?r.invv/r.nw:0)/n,part=clamp(ratio/0.3,0,1);
 const tot=sum(r=>r.ivb?r.ivb.su+r.ivb.rd+r.ivb.sh:0),mx=Math.max(...['su','rd','sh'].map(k=>sum(r=>r.ivb?r.ivb[k]:0))),smax=tot?mx/tot:1;
 const div=tot?(smax<=0.6?1:clamp(1-(smax-0.6)/0.4*0.5,0.5,1)):0,fee=tb?clamp(1-(S.rugi/tb)/0.02,0,1):1;
 I.push({n:'Investasi',w:15,s:(0.4*part+0.25*ready+0.2*div+0.15*fee)*100,t:tb?`Rata-rata ${pc(ratio)}% asetmu ada di investasi (target 30%). ${pc(ready)}% dana dibeli saat dana darurat sudah 3 bulan. Porsi instrumen terbesar ${pc(smax)}% (sebaiknya tidak lebih dari 60%). Biaya jual terbuang ${fmt(S.rugi)}.`:'Kamu tidak berinvestasi sama sekali, jadi hanya mendapat poin dasar.'});
 // 3. utang
 const cost=sum(r=>r.intr)+S.adm,bm=R.filter(r=>r.bor),av=bm.filter(r=>r.pre?r.pre.cash+r.pre.ef+r.pre.inv*0.97>=needOf(r):true).length;
 const negM=S.hist.slice(1).filter(v=>v<0).length,endD=debtTotal();
 I.push({n:'Utang',w:20,s:(0.3*clamp(1-cost/inc/0.03,0,1)+0.25*clamp(1-S.pinjolN/3,0,1)+0.2*(bm.length?1-av/bm.length:1)+0.15*clamp(1-negM/6,0,1)+0.1*clamp(1-endD/(3*C.exp),0,1))*100,t:`Biaya utang total (bunga, tanda terima kasih, admin) ${fmt(cost)}. Pinjol ${S.pinjolN} kali. ${av} dari ${bm.length} bulan berutang sebenarnya bisa dihindari. Aset negatif ${negM} bulan. Sisa utang akhir ${fmt(endD)}.`});
 // 4. asuransi
 const prem=Math.round(C.exp*0.03),pot=sum(r=>(r.med||0)*0.8),A=pot-prem*n,saved=sum(r=>r.save||0),paid=sum(r=>r.prem||0),act=saved-paid;
 let sS=70;if(Math.abs(A)>=prem*0.5){const lo=Math.min(A,0),hi=Math.max(A,0);sS=clamp((act-lo)/(hi-lo),0,1)*100}
 I.push({n:'Asuransi',w:10,s:sS,t:`Klaim yang dihemat ${fmt(saved)}, premi dibayar ${fmt(paid)}. ${Math.abs(A)<prem*0.5?'Kejadian medis nyaris tidak ada, jadi asuransi netral.':A>0?'Pada kejadian ini, berasuransi sepanjang permainan seharusnya menguntungkan.':'Pada kejadian ini, tanpa asuransi justru lebih hemat.'}`});
 // 5. tawaran
 const L=S.offLog.map(l=>Object.assign({},l,offerInsight(l))),gd=L.filter(l=>l.good).length;
 I.push({n:'Keputusan tawaran',w:15,s:L.length?gd/L.length*100:null,t:L.length?`${gd} dari ${L.length} keputusan tawaran dinilai tepat, berdasarkan nilai harapan dan kesiapan kasmu saat itu.`:'Tidak ada tawaran yang muncul, jadi bobotnya dibagi ke kriteria lain.'});
 // 6. dana darurat
 const cv=R.map(r=>r.efv/r.exp);
 I.push({n:'Dana darurat',w:10,s:(0.6*cv.reduce((a,b)=>a+Math.min(b/6,1),0)/n+0.4*cv.filter(v=>v>=3).length/n)*100,t:`Rata-rata dana daruratmu ${(cv.reduce((a,b)=>a+b,0)/n).toFixed(1).replace('.',',')} bulan pengeluaran, dan ${cv.filter(v=>v>=3).length} dari ${n} bulan berada di atas 3 bulan.`});
 const sts=R.map(r=>r.st),avgS=sts.reduce((a,b)=>a+b,0)/n,maxS=Math.max(...sts),hiS=sts.filter(v=>v>=75).length,gayaN=S.com.filter(c=>c.id=='gaya').length;
 I.push({n:'Kesejahteraan (stres)',w:10,s:(0.7*clamp(1-(avgS-20)/60,0,1)+0.3*(1-hiS/n))*100,t:`Tingkat stres rata-rata ${Math.round(avgS)} dari 100, puncaknya ${Math.round(maxS)}. ${hiS} dari ${n} bulan berada di level sangat tinggi (75 ke atas).${gayaN?' Kamu mengambil tawaran gaya hidup '+gayaN+' kali untuk meredakannya.':''}`});
 const W=I.filter(i=>i.s!=null).reduce((a,i)=>a+i.w,0);
 I.forEach(i=>{i.c=i.s==null?null:i.s*i.w/W});
 return {total:Math.round(I.reduce((a,i)=>a+(i.c||0),0)),items:I,W};
}
function scoreHTML(SC){
 return `<h3 style="margin-top:16px">Rincian nilai</h3><div class="scroll"><table><tr><th>Kriteria</th><th>Bobot</th><th>Skor</th><th>Sumbangan</th></tr>${SC.items.map(i=>`<tr><td>${i.n}</td><td>${i.s==null?'-':Math.round(i.w/SC.W*100)+'%'}</td><td>${i.s==null?'-':Math.round(i.s)}</td><td><b>${i.c==null?'-':i.c.toFixed(1).replace('.',',')}</b></td></tr>`).join('')}</table></div>
 <ul class="ins sm">${SC.items.map(i=>`<li><b>${i.n}.</b> ${i.t}</li>`).join('')}</ul>`;
}
function finalScore(){
 const {best,pas}=analyze(),mine=nw(),den=Math.max(best.nw-pas.nw,C.exp),r=(mine-pas.nw)/den;
 return {score:mine>=best.nw?100:Math.round(clamp(r,0,1)*100),pct:Math.round(Math.max(0,r)*100),best:best.nw,pas:pas.nw};
}
const gradeOf=s=>s>=85?'A':s>=70?'B':s>=55?'C':s>=40?'D':'E';
function yearReport(){
 const y=S.m/12,n=nw(),delta=n-S.yNW,cov=S.ef/expNow(),d=debtTotal();
 const income=(C.gaji+C.side)*Math.pow(1.05,y-1)*12;
 const g=clamp(25+delta/income*100,0,50),e=clamp(cov/6,0,1)*30,u=d<=0?20:clamp(20-d/Math.max(1,n+d)*40,0,20);
 const score=Math.round(g+e+u),gr=gradeOf(score);
 S.scores.push({y,score,gr,n,delta,cov,d});dash();
 const msg={A:'Luar biasa. Aset tumbuh, dana darurat kuat, utang terkendali.',B:'Bagus. Fondasimu sehat, tinggal dirapikan sedikit lagi.',C:'Cukup bertahan, tapi masih rawan kalau ada guncangan besar.',D:'Rapuh. Satu kejadian besar bisa membuatmu terjerat utang.',E:'Kritis. Prioritaskan melunasi utang dan membangun dana darurat.'}[gr];
 const last=y>=C.thn;
 $('stage').innerHTML=`<div class="card"><h2>Rapor tahun ${y}</h2>
 <div class="row" style="align-items:center"><div class="grade">${gr}</div><div><b>${score} dari 100</b><p class="muted">${msg}</p></div></div>
 <ul class="ledger"><li><span>Aset bersih akhir tahun</span><b>${fmt(n)}</b></li>
 <li><span>Perubahan dari awal tahun</span><span class="${delta>=0?'pos':'neg'}">${delta>=0?'+':''}${fmt(delta)}</span></li>
 <li><span>Dana darurat</span><span>${cov.toFixed(1)} bulan pengeluaran</span></li>
 <li><span>Total utang</span><span class="${d?'neg':'pos'}">${fmt(d)}</span></li><li><span>Tingkat stres akhir tahun</span><span>${stLv(Math.round(S.stress))[0]} (${Math.round(S.stress)} dari 100)</span></li></ul>
 ${chart()}
 <p class="sm muted">Nilai sementara = pertumbuhan aset (50) + kecukupan dana darurat (30) + beban utang (20). Nilai akhir ditentukan di akhir permainan lewat tujuh kriteria berbobot.</p>
 <div class="row"><button class="btn pri" id="cont">${last?'Lihat hasil akhir':'Lanjut ke tahun '+(y+1)}</button></div></div>`;
 $('cont').onclick=()=>{S.yNW=nw();last?final():monthStart()};
}

/* ---------- HASIL AKHIR ---------- */
function final(){
 const SC=computeScore(),avg=SC.total,gr=gradeRel(avg),n=nw(),d=debtTotal(),risk=(S.hist.slice(1).some(v=>v<0)||S.pinjolN>0)&&avg>=70;
 const title={A:'Ahli Napas Panjang',B:'Pengelola Handal',C:'Penyintas',D:'Hampir Tenggelam',E:(d>0||n<0)?'Jerat Utang':'Uang Belum Bekerja'}[gr];
 const tips=[];
 if(S.pinjolN)tips.push(`Kamu memakai pinjol ${S.pinjolN} kali. Bunganya 9% per bulan, jauh lebih mahal dari opsi lain. Dana darurat adalah pelindung terbaik.`);
 if(S.scores.some(s=>s.cov<3))tips.push('Dana darurat sempat di bawah 3 bulan pengeluaran. Targetkan 6 bulan sebelum mulai berinvestasi besar.');
 if(!S.ins&&S.kejadian>2)tips.push('Kejadian mendadak cukup sering terjadi. Asuransi kesehatan bisa memangkas biaya medis yang besar.');
 if(d>0)tips.push('Masih ada utang di akhir permainan. Lunasi dari bunga tertinggi terlebih dahulu.');
 if(invT()<=0)tips.push('Kamu tidak punya investasi. Uang yang menganggur di kas tergerus inflasi.');
 if(S.iv.sh>0&&S.iv.sh>invT()*0.6)tips.push('Mayoritas investasimu ada di saham. Potensinya tinggi, tapi nilainya bisa turun tajam. Jangan taruh uang yang mungkin dibutuhkan mendadak.');
 if(invT()>0&&S.iv.su>invT()*0.9)tips.push('Investasimu hampir semuanya di surat utang. Aman, tapi pertumbuhannya terbatas. Campur dengan instrumen lain untuk tujuan jangka panjang.');
 if(S.rugi>0)tips.push(`Menjual investasi saat terdesak menghabiskan biaya ${fmt(S.rugi)}.`);
 const avS=S.rec.reduce((a,r)=>a+r.st,0)/Math.max(1,S.rec.length);
 if(avS>=55)tips.push('Stresmu rata-rata tinggi ('+Math.round(avS)+' dari 100). Penyebab terbesarnya biasanya utang berbunga tinggi dan dana darurat tipis. Membereskan keduanya menurunkan stres tanpa mengeluarkan uang.');
 if(!S.ins&&PER.hr>=0.4)tips.push('Kondisi kesehatan tokohmu rentan, tapi kamu tidak memakai asuransi. Biaya medis ditanggung sendiri dan menambah stres.');
 if(!tips.length)tips.push('Keputusanmu konsisten dan disiplin. Pertahankan kebiasaan ini.');
 $('stage').innerHTML=`<div class="card"><h2>Hasil akhir: ${title}</h2>
 <div class="row" style="align-items:center"><div class="grade">${gr}</div><div><b>Nilai ${avg} dari 100 (Level ${LEVELS[C.lv].n})</b><p class="muted">Aset bersih akhirmu ${fmt(n)} (awal ${fmt(S.hist[0])}). Nilai adalah gabungan tujuh kriteria berbobot.${risk?' Catatan: kamu sempat minus atau memakai pinjol. Hasilnya bagus, tapi itu risiko yang sebaiknya dihindari.':''}</p></div></div>
 ${scoreHTML(SC)}
 <div class="scroll"><table><tr><th>Tahun</th><th>Aset bersih</th><th>Utang</th><th>Dana darurat</th><th>Nilai sementara</th></tr>
 ${S.scores.map(s=>`<tr><td>${s.y}</td><td>${fmt(s.n)}</td><td>${fmt(s.d)}</td><td>${s.cov.toFixed(1)} bln</td><td><b>${s.gr}</b> (${s.score})</td></tr>`).join('')}</table></div>
 ${chart()}<h3 style="margin-top:14px">Catatan untukmu</h3><ul class="ins">${tips.map(t=>`<li>${t}</li>`).join('')}</ul>
 ${bestHTML()}${insightHTML()}<div class="row"><button class="btn pri" id="again">Main lagi di tingkatan yang sama</button><button class="btn" id="chg">Ganti tingkatan</button></div></div>`;
 $('again').onclick=initState;
 $('chg').onclick=()=>{LVSEL=C.lv;DURSEL=C.thn;setup()};
}
setup();
</script>
